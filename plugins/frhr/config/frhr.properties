# 작성: 오픈브릿지시스템즈 김현석 / 2018.03.05
###############################################################################
# (주)퓨처리테일 인사(frhr) 설정
###############################################################################

# 고용 관계의 회사 PartyGroup (Employment.partyIdFrom)
company.partyId=Company

# 사번 접두어
emplNo.prefix=FR

# 급여 - 통상임금 산정 월 소정근로시간, 연장근로 가산율
payroll.standardMonthlyHours=209
payroll.overtimeFactor=1.5

# 급여 - 수습 (2023.05.22 한예린 [SR-2023-0388])
# 입사일로부터 probation.months 개월 동안 기본급의 probation.rate(%) 지급
payroll.probation.months=3
payroll.probation.rate=90

# 급여 미리보기용 4대보험 요율(%) - 미리보기 화면은 DB 조회 없이 아래 값을 사용
# (정식 급여계산은 FrInsuranceRate 테이블 기준)
# 2019.02.25 윤서진 2019 건강보험 요율 반영 (3.12 -> 3.23)
health.rate=3.23
longterm.rate=7.38
pension.rate=4.5
employ.rate=0.65
incomeTax.rate=3
# 2024.01.15 한예린 [SR-2024-0047] 2024 건강보험 요율 (2023과 동일 3.545, 동결)
# 기존 health.rate 는 과거 연도 미리보기에서 사용 중이라 그대로 두고 연도 키로 추가
health.rate.2024=3.545

# 2022.02.09 임재훈
temp.flag=N
