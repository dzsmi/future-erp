# 작성: 오픈브릿지시스템즈 김현석 / 2018.02.12
###############################################################################
# (주)퓨처리테일 재경 플러그인 설정
###############################################################################

# 회계 거래를 생성할 내부 조직 partyId (PartyAcctgPreference가 등록된 법인)
fracct.organizationPartyId=FR_COMPANY

# 전표 최종 승인 시 생성하는 AcctgTrans 기본값
fracct.acctgTransTypeId=INTERNAL_ACCTG_TRANS
fracct.glFiscalTypeId=ACTUAL
fracct.acctgTransEntryTypeId=_NA_

# 기본 통화
fracct.currencyUomId=KRW

# 2018.08.27 박준영
debug.payroll=N

# 2020.12.14 홍성민
batch.useYn=N

###############################################################################
# 법인카드 연동 (2021.02 핀링크 송태호)
###############################################################################
# 카드사 승인내역 파일 수신/완료 디렉토리 (핀링크 중계 서버에서 SFTP 로 내려줌)
fracct.card.recvDir=/data/ofbiz/fracct/card/recv
fracct.card.doneDir=/data/ofbiz/fracct/card/done
# 카드사 파일 인코딩
fracct.card.fileCharset=MS949
# 중계 서버 (수신 확인 콜백)
fracct.card.relayUrl=https://card-relay.example.com/futureretail/ack
fracct.card.relayKey=FRL-TEST-0000-0000
# 자동전표 계정 (2021.02.15, 재경팀 정해인 과장 확인)
#  비용 기본계정(카드별 FrCardMaster.expenseGlAccountId 가 우선) / 부가세대급금 / 미지급금(카드대금)
fracct.card.gl.expense=680000
fracct.card.gl.vat=151900
fracct.card.gl.payable=212000
# 미지급금 거래처 (카드사 partyId, 미정)
fracct.card.cardCompanyPartyId=

# 2021.04.12 정해인 법인카드 소명 화면 - 사용 제한 업종 (콤마 구분, 카드사 업종명)
cardRestrictMcc=유흥주점,단란주점,골프장,안마시술소

###############################################################################
# 전자세금계산서 연동 (2021.06 핀링크 송태호)
###############################################################################
# 발행 ASP (국세청 전송 대행)
fracct.etax.aspUrl=https://etax-asp.example.com/api/v1/taxinvoice/issue
fracct.etax.apiKey=ETAX-TEST-KEY-0000-0000
fracct.etax.corpNum=1208800000
fracct.etax.timeoutMs=15000
# Y : ASP 호출 없이 가승인번호 발급 (개발/검증 서버)
fracct.etax.testMode=Y

# 2022.07.11 임재훈 결재 알림 메일
appr.noti.mail.useYn=Y
appr.noti.mail.from=erp-noreply@futureretail.example.com
